name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        run: bun run build:binary

      - name: Verify database migrations
        env:
          DATABASE_URL: ${{ runner.temp }}/release.db
        run: |
          ./flightlesskiwi migrate
          ./flightlesskiwi migrate

      - name: Package build
        id: package
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          bundle="${REPOSITORY_NAME}_${version}"
          archive="${bundle}.tar.gz"

          mkdir "$bundle"
          cp -R \
            flightlesskiwi LICENSE README.md .env.example compose.example.yml \
            "$bundle/"
          tar -czf "$archive" "$bundle"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release build
        uses: actions/upload-artifact@v7
        with:
          name: release-binary
          path: |
            ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  docker-build:
    name: docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
        run: |
          mkdir -p "$DIGEST_DIRECTORY"
          touch "$DIGEST_DIRECTORY/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: docker (manifest)
    needs:
      - docker-build
    runs-on: ubuntu-26.04

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Create and push multi-platform manifest
        env:
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          tag_arguments=()
          while IFS= read -r tag; do
            tag_arguments+=(--tag "$tag")
          done <<< "$TAGS"

          digest_arguments=()
          for digest_file in "$DIGEST_DIRECTORY"/*; do
            digest_arguments+=("${IMAGE_NAME}@sha256:${digest_file##*/}")
          done

          docker buildx imagetools create \
            "${tag_arguments[@]}" \
            "${digest_arguments[@]}"

      - name: Inspect multi-platform image
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE_NAME:$VERSION"

  publish:
    needs:
      - build
      - docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release build
        uses: actions/download-artifact@v8
        with:
          name: release-binary
          path: artifacts

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: -v --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          draft: false
          generate_release_notes: false
          make_latest: true
          files: |
            artifacts/*.tar.gz
