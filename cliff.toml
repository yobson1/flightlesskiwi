# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[remote.github]
owner = "yobson1"
repo = "flightlesskiwi"

[changelog]
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version }}]\
          ({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{%- if github -%}
  {% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
    ## New Contributors ❤️
  {% endif %}\
  {% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
    * @{{ contributor.username }} made their first contribution
      {%- if contributor.pr_number %} in \
        [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
      {%- endif %}
  {%- endfor -%}
{%- endif %}

{% if version %}
    ## Deployment

    ### Docker Compose

    - Copy `compose.example.yml` and `.env.example`, then configure the required values.
    - Set `FLIGHTLESSKIWI_IMAGE` to \
      `ghcr.io/{{ remote.github.owner }}/{{ remote.github.repo }}:{{ version | trim_start_matches(pat="v") }}`.
    - Start the services with `docker compose up -d`.

    ### Standalone binary

    - Download and extract \
      `{{ remote.github.repo }}_{{ version | trim_start_matches(pat="v") }}.tar.gz`.
    - Configure the environment, including `DATABASE_URL`.
    - Start the standalone server with `./{{ remote.github.repo }}`. Database migrations are \
      applied automatically before the server starts.
{% endif %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = [{ pattern = '.*', replace_command = 'typos --write-changes -' }]
protect_breaking_commits = false
commit_parsers = [
	{ message = "^chore\\(release\\):", skip = true },
	{ message = "^chore\\(deps.*\\)", skip = true },
	{ message = "^Merge branch '.*'", skip = true },
	{ message = "^feat", group = "<!-- 0 -->🚀 Features" },
	{ message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
	{ message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
	{ message = "^doc", group = "<!-- 3 -->📚 Documentation" },
	{ message = "^perf", group = "<!-- 4 -->⚡ Performance" },
	{ message = "^style", group = "<!-- 5 -->🎨 Styling" },
	{ message = "^test", group = "<!-- 6 -->🧪 Testing" },
	{ message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
	{ message = "^security", group = "<!-- 8 -->🛡️ Security" },
	{ message = "^revert", group = "<!-- 9 -->◀️ Revert" },
	{ message = ".*", group = "<!-- 10 -->💼 Other" }
]
filter_commits = true
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
